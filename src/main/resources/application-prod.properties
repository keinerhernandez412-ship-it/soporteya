# Perfil de producción: más rápido, menos ruido en los registros y cookies seguras
spring.thymeleaf.cache=true
spring.jpa.show-sql=false
logging.level.root=INFO

# La plataforma de la nube dice en qué puerto escuchar (variable PORT)
server.port=${PORT:8080}
# Detrás del proxy HTTPS de la nube: respetar los encabezados X-Forwarded-*
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.error.include-stacktrace=never