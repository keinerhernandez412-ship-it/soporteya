# ============================================================
# SoporteYa · configuración común a todos los perfiles
# Los valores secretos o que cambian por ambiente llegan por variables de entorno: ${NOMBRE:valor por defecto}
# ============================================================
spring.application.name=soporteya

# Si nadie dice otra cosa, se usa el perfil «dev». En el servidor: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Base de datos
spring.datasource.url=postgresql://adso:8j2mLGy8lTaTzB3Vcl5FI4rsYnmTy6zv@dpg-dc5ei7cipgvc73c36g4g-a/soporteya_1bzg
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soporteya}
spring.datasource.username=${DB_USER:adso}
spring.datasource.password=${DB_PASSWORD}

# Unidad 5 · Flyway crea y actualiza las tablas. Hibernate solo VALIDA que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Idioma
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Reglas del negocio
soporteya.dominio-correo=${DOMINIO_CORREO:soporteya.co}
server.servlet.session.timeout=30m

# Seguridad de la API
soporteya.jwt.secreto=${JWT_SECRETO}
soporteya.cors.origenes=${CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500}